# Mirrors k8s/components/api-ingress.yaml for the docker-compose bring-up.
# Uses Docker's embedded DNS (127.0.0.11) with variable upstreams so nginx
# resolves controller names at request time (won't fail to boot if a
# controller is still starting).
server {
    listen 80;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /service-inquiry        { set $u customer-service:5555; proxy_pass http://$u$request_uri; }
    location /consume-service        { set $u customer-service:5555; proxy_pass http://$u$request_uri; }
    location /send-attachment-customer  { set $u customer-service:5555; proxy_pass http://$u$request_uri; }
    location /process-response-customer { set $u customer-service:5555; proxy_pass http://$u$request_uri; }
    location /test-service-customer     { set $u customer-service:5555; proxy_pass http://$u$request_uri; }

    location /service-registration      { set $u provider-service:6666; proxy_pass http://$u$request_uri; }
    location /send-attachment-provider  { set $u provider-service:6666; proxy_pass http://$u$request_uri; }
    location /process-response-provider { set $u provider-service:6666; proxy_pass http://$u$request_uri; }
    location /test-service-provider     { set $u provider-service:6666; proxy_pass http://$u$request_uri; }

    location / { return 404; }
}
