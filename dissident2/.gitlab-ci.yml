stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

services:
  - docker:dind

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build-accesspoint:
  stage: build
  script:
    - docker build -t carlosegat/d2-accesspoint accesspoint/
    - docker push carlosegat/d2-accesspoint
  only:
    - main

build-dlg:
  stage: build
  script:
    - docker build -t carlosegat/d2-dlg dlg/
    - docker push carlosegat/d2-dlg
  only:
    - main

build-client:
  stage: build
  script:
    - docker build -t carlosegat/d2-client client/
    - docker push carlosegat/d2-client
  only:
    - main

deploy-to-k8s:
  stage: deploy
  image: bitnami/kubectl
  script:
    - kubectl delete -f /home/dissident/dissident2/k8s/ --ignore-not-found
    - kubectl apply -f /home/dissident/dissident2/k8s/
  only:
    - main
