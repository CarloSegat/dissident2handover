      ACAPY_DEBUG_CONNECTIONS: "true"
      ACAPY_ENDPOINT: "http://provider:6100"
      ACAPY_LABEL: "provider"
      ACAPY_LOG_LEVEL: "info"
      ACAPY_GENESIS_URL: "http://test.bcovrin.vonx.io/genesis"
      ADMIN_PORT: "6000"
      AGENT_PORT: "6100"
    entrypoint: /bin/bash
    command: ["-c",
        "aca-py start \
        --admin '0.0.0.0' 6000 \
        --inbound-transport http '0.0.0.0' 6100 \
        --outbound-transport http  \
        --wallet-type askar \
        --wallet-name tub-wallet \
        --wallet-key tub-key \
        --preserve-exchange-records \
        --auto-provision \
        --public-invites \
        --seed Dissident2_Provider_---_00000000 \
        --auto-respond-credential-proposal \
        --auto-respond-credential-offer \
        --auto-respond-credential-request \
        --auto-respond-presentation-proposal \
        --auto-respond-presentation-request \
        --auto-store-credential \
        --auto-verify-presentation \
        --preserve-exchange-records \
        --log-level INFO \
        --auto-ping-connection \
        --public-invites \       
        --requests-through-public-did \
        --webhook-url http://130.149.223.197:6666/webhook"
    ]
    ports:
      - "6000:6000"
      - "6100:6100"
      
  ap:
    image: bcgovimages/aries-cloudagent:py3.9-indy-1.16.0_0.10.4
    container_name: ap
    environment:
      ACAPY_ADMIN_INSECURE_MODE: "true"
      ACAPY_AUTO_PROVISION: "true"
      ACAPY_DEBUG_CONNECTIONS: "true"
      ACAPY_ENDPOINT: "http://ap:7100"
      ACAPY_LABEL: "ap"
      ACAPY_LOG_LEVEL: "info"
      ACAPY_GENESIS_URL: "http://test.bcovrin.vonx.io/genesis"
      ADMIN_PORT: "7000"
      AGENT_PORT: "7100"
    entrypoint: /bin/bash
    command: ["-c",
        "aca-py start \
        --admin '0.0.0.0' 7000 \
        --inbound-transport http '0.0.0.0' 7100 \
        --outbound-transport http  \
        --wallet-type askar \
