version: "3"
services:
  customer:
    image: bcgovimages/aries-cloudagent:py3.9-indy-1.16.0_0.10.4
    container_name: customer
    environment:
      ACAPY_ADMIN_INSECURE_MODE: "true"
      ACAPY_AUTO_PROVISION: "true"
      ACAPY_DEBUG_CONNECTIONS: "true"
      ACAPY_ENDPOINT: "http://customer:5100"
      ACAPY_LABEL: "customer"
      ACAPY_LOG_LEVEL: "info"
      ACAPY_GENESIS_URL: "http://test.bcovrin.vonx.io/genesis"
      ADMIN_PORT: "5000"
      AGENT_PORT: "5100"
    entrypoint: /bin/bash
    command: ["-c",
        "aca-py start \
        --admin '0.0.0.0' 5000 \
        --inbound-transport http '0.0.0.0' 5100 \
        --outbound-transport http  \
        --wallet-type askar \
        --wallet-name tub-wallet \
        --wallet-key tub-key \
        --preserve-exchange-records \
        --auto-provision \
        --public-invites \
        --seed Dissident2_Client_---_0000000000 \
        --auto-respond-credential-proposal \
        --auto-respond-credential-offer \
        --auto-respond-credential-request \
        --auto-respond-presentation-proposal \
        --auto-respond-presentation-request \
        --auto-store-credential \
        --auto-verify-presentation \
        --preserve-exchange-records \
        --log-level INFO \
        --auto-ping-connection \
        --public-invites \
        --requests-through-public-did \
        --webhook-url http://130.149.223.197:5555/webhook"
    ]
    ports:
      - "5000:5000"
      - "5100:5100"

  provider:
    image: bcgovimages/aries-cloudagent:py3.9-indy-1.16.0_0.10.4
    container_name: provider
