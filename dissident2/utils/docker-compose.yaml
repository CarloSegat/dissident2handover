        --preserve-exchange-records \
        --auto-provision \
        --public-invites \
        --seed Dissident2_Issuer2_---_000000000 \
        --auto-respond-credential-proposal \
        --auto-respond-credential-offer \
        --auto-respond-credential-request \
        --auto-respond-presentation-proposal \
        --auto-respond-presentation-request \
        --auto-store-credential \
        --auto-verify-presentation \
        --preserve-exchange-records \
        --log-level INFO \
        --auto-ping-connection \
        --public-invites \
        --requests-through-public-did \
        --wallet-storage-type 'postgres_storage' \
        --wallet-storage-config '{\"url\":\"postgres-new:5432\",\"wallet_scheme\":\"MultiWalletSingleTable\", \"storage_config\":{\"url\":\"postgres-new:5432\",\"max_connections\":5,\"min_idle_time\":1,\"connection_timeout\":10}}' \
        --wallet-storage-creds '{\"account\":\"walletuser\",\"password\":\"walletpassword\",\"admin_account\":\"walletuser\",\"admin_password\":\"walletpassword\"}' \
        --webhook-url http://130.149.223.213:4444/webhook"
    ]
