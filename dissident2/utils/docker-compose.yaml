  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: walletpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  postgres-new:
    image: postgres:latest
    container_name: postgres-new
    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: walletpassword
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    ports:
      - "5433:5432"
      
  issuer:
    image: bcgovimages/aries-cloudagent:py3.9-indy-1.16.0_0.10.4
    container_name: issuer
    environment:
      ACAPY_ADMIN_INSECURE_MODE: "true"
      ACAPY_AUTO_PROVISION: "true"
      ACAPY_DEBUG_CONNECTIONS: "true"
      ACAPY_ENDPOINT: "http://issuer:9100"
      ACAPY_LABEL: "issuer"
      ACAPY_LOG_LEVEL: "info"
      ACAPY_GENESIS_URL: "http://test.bcovrin.vonx.io/genesis"
      ADMIN_PORT: "9000"
      AGENT_PORT: "9100"
    entrypoint: /bin/bash
    command: ["-c",
        "aca-py start \
        --admin '0.0.0.0' 9000 \
        --inbound-transport http '0.0.0.0' 9100 \
        --outbound-transport http  \
        --wallet-type askar \
        --wallet-name tub-wallet \
        --wallet-key tub-key \
        --preserve-exchange-records \
        --auto-provision \
        --public-invites \
        --seed Dissident2_Issuer_---_0000000000 \
        --auto-respond-credential-proposal \
        --auto-respond-credential-offer \
        --auto-respond-credential-request \
        --auto-respond-presentation-proposal \
        --auto-respond-presentation-request \
        --auto-store-credential \
        --auto-verify-presentation \
        --preserve-exchange-records \
        --log-level INFO \
        --auto-ping-connection \
        --public-invites \
        --requests-through-public-did \
        --wallet-storage-type 'postgres_storage' \
        --wallet-storage-config '{\"url\":\"postgres:5432\",\"wallet_scheme\":\"MultiWalletSingleTable\", \"storage_config\":{\"url\":\"postgres:5432\",\"max_connections\":5,\"min_idle_time\":1,\"connection_timeout\":10}}' \
        --wallet-storage-creds '{\"account\":\"walletuser\",\"password\":\"walletpassword\",\"admin_account\":\"walletuser\",\"admin_password\":\"walletpassword\"}' \
        --webhook-url http://130.149.223.197:9999/webhook"
    ]
    ports:
      - "9000:9000"
      - "9100:9100"

  issuer2:
    image: bcgovimages/aries-cloudagent:py3.9-indy-1.16.0_0.10.4
    container_name: issuer2
    environment:
      ACAPY_ADMIN_INSECURE_MODE: "true"
      ACAPY_AUTO_PROVISION: "true"
