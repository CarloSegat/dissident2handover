[tool.poetry]
name = "snet_resolver"
version = "0.1.0"
description = "ACA-Py DID Resolver for Github DID Method"
authors = ["Daniel Bluhm <dbluhm@pm.me>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.6.9"
aiohttp = "^3.6.2"
aries-cloudagent = {git = "https://github.com/hyperledger/aries-cloudagent-python", rev = "66c9c02"}
pydid = "^0.4.0"

[build-system]
requires = ["setuptools", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
